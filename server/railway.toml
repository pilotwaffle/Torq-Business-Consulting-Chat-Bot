# Railway deploy config for TORQ Chat BFF
# Docs: https://docs.railway.app/reference/config-as-code
#
# Set secrets in the Railway dashboard (never in this file):
#   ANTHROPIC_API_KEY, SESSION_SECRET, CORS_ORIGINS, DAILY_TOKEN_BUDGET, PORT

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway injects PORT; the app reads process.env.PORT (default 8787).
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
